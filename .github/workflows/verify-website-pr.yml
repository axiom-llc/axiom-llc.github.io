name: Verify website PR

# Bounded validation for the requested PR; no deployment or scheduler changes.
on:
  push:
    branches: [website-enterprise-packages-2026-11-05]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/verify-website-pr.yml'
      - '.github/workflows/native-rsi.yml'
      - 'rsi/**'
      - 'tests-browser-rsi.cjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fail-closed manual Pages release contract
        run: |
          python - <<'PY'
          from pathlib import Path
          content = Path('.github/workflows/pages.yml').read_text()
          assert 'workflow_dispatch:' in content
          assert 'expected_sha:' in content
          assert 'github.ref == \'refs/heads/main\'' in content
          assert 'test "$GITHUB_SHA" = "$EXPECTED_SHA"' in content
          assert 'test "$observed" = "$EXPECTED_SHA"' in content
          assert '    branches: [main]' not in content
          PY
      - name: Verify complete original assets and source
        run: |
          python -m unittest discover -s tests -v
          git diff --check
          node --check theme.js
          node --check tests-browser-rsi.cjs
          python -m unittest rsi.test_native -v
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/site-browser" playwright@1.56.1
          "$RUNNER_TEMP/site-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify original and conversion browser behavior
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/site-browser/node_modules/playwright
        run: |
          node tests-browser.cjs
          node tests-browser-conversion.cjs
          node tests-browser-rsi.cjs
          python -m rsi.benchmark --browser-report browser-results/rsi-browser-benchmark.json --output browser-results/rsi-normalized-benchmark.json
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-pr-browser-evidence
          path: browser-results/
          retention-days: 7
      - name: Retain original artwork for snapshot recovery
        uses: actions/upload-artifact@v4
        with:
          name: website-original-artwork
          path: |
            assets/visual/*.png
            assets/director-orchestration-core.png
            assets/brand/axiom-mark-1024.png
          retention-days: 7
