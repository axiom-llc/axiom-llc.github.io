name: Deploy GitHub Pages

# Owner-authorized release: deploy validated main commits to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate site
        run: |
          python -m unittest discover -s tests -v
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text()
          names = [
              "ASUS",
              "LG Electronics",
              "Advanced Micro Devices, Inc.",
              "Arch Linux",
              "Android",
          ]
          assets = [
              "asus.svg", "lg.svg", "amd.svg", "arch-linux.svg", "android.svg",
          ]
          assert all(name in html for name in names)
          for asset in assets:
              path = Path("assets/technology/ecosystem") / asset
              assert path.is_file() and path.stat().st_size > 0, path
              assert str(path) in html, path
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live production
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          ok=0
          for _ in $(seq 1 18); do
            if curl -fsSL --retry 2 --retry-delay 2 "$base/?deployment=${GITHUB_SHA}" -o /tmp/live.html &&
               grep -Fq "Crash recovery, demonstrated." /tmp/live.html &&
               grep -Fq "assets/demos/apex-recovery.svg" /tmp/live.html &&
               grep -Fq "Technology ecosystem" /tmp/live.html &&
               grep -Fq "ASUS" /tmp/live.html &&
               grep -Fq "LG Electronics" /tmp/live.html &&
               grep -Fq "Advanced Micro Devices, Inc." /tmp/live.html &&
               grep -Fq "Arch Linux" /tmp/live.html &&
               grep -Fq "Android" /tmp/live.html; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
          for asset in asus.svg lg.svg amd.svg arch-linux.svg android.svg; do
            curl -fsSL --retry 3 "$base/assets/technology/ecosystem/$asset" -o /dev/null
          done
          curl -fsSL --retry 3 "$base/assets/demos/apex-recovery.svg" -o /tmp/apex-recovery.svg
          grep -Fq "APEX recovery demonstration" /tmp/apex-recovery.svg

          # Verify the released commercial offer and critical live application routes.
          # Bounded retries accommodate Pages CDN propagation after artifact deploy.
          published=0
          for _ in $(seq 1 18); do
            if curl -fsSL --retry 2 --retry-delay 2 "$base/engagements/reliability-control-sprint/?deployment=${GITHUB_SHA}" -o /tmp/live-packages.html &&
               grep -Fq "Agent Failure Triage" /tmp/live-packages.html &&
               grep -Fq '$1,500' /tmp/live-packages.html &&
               grep -Fq '$5,000' /tmp/live-packages.html &&
               grep -Fq "Production Hardening" /tmp/live-packages.html &&
               grep -Fq '$12,500' /tmp/live-packages.html &&
               grep -Fq "Execution Assurance" /tmp/live-packages.html &&
               grep -Fq 'From $25,000' /tmp/live-packages.html &&
               grep -Fq "Model-agnostic engineering" /tmp/live-packages.html &&
               grep -Fq "Send the system, objective, constraint, and acceptance target." /tmp/live-packages.html; then
              published=1
              break
            fi
            sleep 10
          done
          test "$published" -eq 1
          for route in director systems research engineering contact engagements case-studies; do
            curl -fsSL --retry 3 "$base/$route/?deployment=${GITHUB_SHA}" -o /dev/null
          done
          for asset in styles.css theme.js assets/brand/axiom-mark-64.png assets/visual/hero-axiom.png; do
            curl -fsSL --retry 3 "$base/$asset?deployment=${GITHUB_SHA}" -o /dev/null
          done

