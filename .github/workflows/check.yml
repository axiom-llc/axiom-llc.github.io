name: Site checks
# Owner hold: no automatic triggers. Earliest review 2026-11-01;
# explicit Owner confirmation of usable Actions quota required before restoring.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    if: ${{ false }} # Manual dispatch is also suspended during the Owner hold.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
      - name: Install browser verification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/site-browser" playwright@1.56.1
          "$RUNNER_TEMP/site-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify featured demo across widths and themes
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/site-browser/node_modules/playwright
        run: node tests-browser.cjs
      - name: Retain responsive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: homepage-responsive
          path: browser-results/

